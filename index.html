<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            width: 100%;
            max-width: 400px;
        }

        .mode-switcher {
            display: flex;
            gap: 8px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .mode-btn {
            padding: 8px 16px;
            border: 1px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            background: #f0f0f0;
        }

        .mode-btn.active {
            background: #000000;
            color: #ffffff;
        }

        .timer-display {
            font-size: 96px;
            font-weight: 200;
            line-height: 1;
            margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .progress-ring {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 40px;
        }

        .progress-ring svg {
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: #e5e5e5;
            stroke-width: 3;
        }

        .progress-ring-fill {
            fill: none;
            stroke: #000000;
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .control-btn {
            padding: 14px 36px;
            border: 1px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 100px;
        }

        .control-btn:hover {
            background: #f0f0f0;
        }

        .control-btn.primary {
            background: #000000;
            color: #ffffff;
        }

        .control-btn.primary:hover {
            background: #333333;
        }

        .task-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }

        .task-input::placeholder {
            color: #999999;
        }

        .stats {
            font-size: 14px;
            color: #666666;
            margin-top: 20px;
        }

        .stats span {
            color: #000000;
            font-weight: 600;
        }

        /* 完成动画 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .finished {
            animation: pulse 1s ease-in-out infinite;
        }

        /* 提示音使用 Web Audio API，无需外部文件 */
    </style>
</head>
<body>
    <div class="container">
        <div class="mode-switcher">
            <button class="mode-btn active" data-mode="work" data-time="25">专注</button>
            <button class="mode-btn" data-mode="shortBreak" data-time="5">短休</button>
            <button class="mode-btn" data-mode="longBreak" data-time="15">长休</button>
        </div>

        <div class="progress-ring">
            <svg width="280" height="280">
                <circle class="progress-ring-bg" cx="140" cy="140" r="130"></circle>
                <circle class="progress-ring-fill" cx="140" cy="140" r="130"
                    stroke-dasharray="816.8"
                    stroke-dashoffset="0"></circle>
            </svg>
            <div class="timer-text-overlay" id="timerDisplay">25:00</div>
        </div>

        <input type="text" class="task-input" id="taskInput" placeholder="当前任务...">

        <div class="controls">
            <button class="control-btn primary" id="startBtn">开始</button>
            <button class="control-btn" id="resetBtn">重置</button>
        </div>

        <div class="stats">
            今日完成: <span id="completedCount">0</span> 个番茄
        </div>
    </div>

    <script>
        // 配置
        const DEBUG = false; // 开启后所有倒计时缩减为 10 秒
        const MODES = {
            work: { time: DEBUG ? 10 : 25 * 60, label: '专注' },
            shortBreak: { time: DEBUG ? 10 : 5 * 60, label: '短休' },
            longBreak: { time: DEBUG ? 10 : 15 * 60, label: '长休' }
        };

        // 状态
        let currentMode = 'work';
        let timeLeft = MODES.work.time;
        let totalTime = MODES.work.time;
        let isRunning = false;
        let timerInterval = null;
        let completedPomodoros = parseInt(localStorage.getItem('completedPomodoros') || '0');

        // DOM 元素
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const progressRing = document.querySelector('.progress-ring-fill');
        const completedCount = document.getElementById('completedCount');
        const taskInput = document.getElementById('taskInput');

        const CIRCUMFERENCE = 2 * Math.PI * 130; // 816.8

        // 初始化显示
        completedCount.textContent = completedPomodoros;
        updateDisplay();

        // 模式切换
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isRunning) {
                    if (!confirm('切换模式会重置当前计时，是否继续？')) return;
                    pauseTimer();
                }
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                totalTime = parseInt(btn.dataset.time) * 60;
                timeLeft = totalTime;
                updateDisplay();
                updateProgress();
            });
        });

        // 开始/暂停
        startBtn.addEventListener('click', () => {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        // 重置
        resetBtn.addEventListener('click', () => {
            pauseTimer();
            timeLeft = totalTime;
            updateDisplay();
            updateProgress();
        });

        function startTimer() {
            isRunning = true;
            startBtn.textContent = '暂停';
            document.title = `${formatTime(timeLeft)} - 番茄钟`;
            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();
                updateProgress();
                if (timeLeft <= 0) {
                    finishTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            startBtn.textContent = '开始';
            document.title = '番茄钟';
            clearInterval(timerInterval);
        }

        function finishTimer() {
            pauseTimer();
            playBeep();
            document.querySelector('.progress-ring').classList.add('finished');
            
            if (currentMode === 'work') {
                completedPomodoros++;
                localStorage.setItem('completedPomodoros', completedPomodoros);
                completedCount.textContent = completedPomodoros;
            }
            
            setTimeout(() => {
                document.querySelector('.progress-ring').classList.remove('finished');
                alert(`${MODES[currentMode].label}时间结束！让眼睛放松一下`);
                timeLeft = totalTime;
                updateDisplay();
                updateProgress();
            }, 100);
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
        }

        function updateProgress() {
            const offset = CIRCUMFERENCE - (timeLeft / totalTime) * CIRCUMFERENCE;
            progressRing.style.strokeDashoffset = offset;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Web Audio API 提示音
        function playBeep() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.5);

            // 三连音
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 800;
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc2.start(audioCtx.currentTime);
                osc2.stop(audioCtx.currentTime + 0.5);
            }, 200);

            setTimeout(() => {
                const osc3 = audioCtx.createOscillator();
                const gain3 = audioCtx.createGain();
                osc3.connect(gain3);
                gain3.connect(audioCtx.destination);
                osc3.frequency.value = 1000;
                osc3.type = 'sine';
                gain3.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain3.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc3.start(audioCtx.currentTime);
                osc3.stop(audioCtx.currentTime + 0.8);
            }, 400);
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== taskInput) {
                e.preventDefault();
                startBtn.click();
            }
        });
    </script>
</body>
</html>
